# Name of workflow
name: Node CI

# Trigger the workflow on push or pull request
on:
  - push
  - pull_request

env:
  CI: true

jobs:
  build:

    # The type of machine to run the job on
    runs-on: ubuntu-latest

    steps:
        # Check-out repository under GitHub workspace
        # https://github.com/actions/checkout
      - uses: actions/checkout@v7
      # Ставит Node и hk из mise.toml, hk нужен для git-хуков в make install
      - uses: jdx/mise-action@v5
      - run: make install
      - run: make lint
        # Coverage thresholds live in vitest.config.js — this step fails
        # when coverage drops below them, so the CI badge reflects coverage too
      - run: make test-coverage
