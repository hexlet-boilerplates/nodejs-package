# Ставит автослияние на minor и patch PR от Dependabot.
# Само слияние ждёт обязательных проверок защиты main. Без неё gh pr merge --auto
# сливает PR сразу, поэтому в репозитории без обязательных проверок workflow
# ничего не делает.
name: Dependabot auto-merge

on: pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.event.pull_request.base.ref }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: protection
        run: |
          count=$(gh api "repos/$REPO/branches/$BASE" --jq '.protection.required_status_checks.contexts | length')
          echo "required=$count" >> "$GITHUB_OUTPUT"
          echo "Обязательных проверок на $BASE: $count"
      - id: metadata
        if: steps.protection.outputs.required != '0'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
